[workspace]
resolver = "2"
members = [
    "crates/fmnr-core",
    "crates/fmnr-fs",
    "crates/fmnr-archive",
    "crates/fmnr-remote",
    "crates/fmnr-mount",
    "crates/fmnr-pkg",
    "crates/fmnr-icons",
    "crates/fmnr-plugins",
    "crates/fmnr-ui",
    "crates/fmnr-ai",
    "crates/fmnr-share",
    "crates/fmnr-cli",
    "crates/fmnr-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/bfxh/fmnr"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.9"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.31", features = ["image", "svg"] }
wasmi = "0.47"

# 这里刻意**不留**「将来要用的」占位依赖。原先挂着 toml / notify / image / rayon
# 四条，没有任何成员引用（`Cargo.lock` 里查得到是 0 个），代码里也用不到——
# 它们只在 DESIGN 的技术选型表里撑场面，等于「文档声称有能力、锁文件里没有」。
# 需要时再加，比让死条目继续把假能力坐实便宜。
# 注：`egui_extras::image::*` 是 egui_extras 自己的重导出，不是 image crate。

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
