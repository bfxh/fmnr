# CI 门禁。
#
# 每个 step 钉一条**会判红**的结论，注释里写明是哪条；不写「跑了但判不出东西」的步骤。
# 第三方 action 只用了 checkout 与 rust-toolchain（这两个是事实标准），
# **没有**引入 rust-cache：缓存层多一个可写的外部依赖，而这里的 job 数量少、
# 全量编译的墙钟可以接受——换供应链面不值。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 最小权限：门禁只需要读代码。写权限留给 release.yml，按需在那份里声明。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁 1：格式与 lint ────────────────────────────────────────────
  # 钉的结论：`cargo fmt` 与 `clippy -D warnings` 在**两个平台**都干净。
  # 分开成一个 job 而不是塞进 host：lint 判红时不该掩盖测试结论，反之亦然。
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # clippy --all-targets 才覆盖 tests/ benches：只查 lib 会漏掉
      # 「测试代码里的 lint」这类漂移。
      - run: cargo fmt --all --check
      # --keep-going：不带它时，第一个判红的 crate 会挡住它的所有下游，
      # 于是「本地绿但 ubuntu 红」要一轮才剥一个错（本仓首两轮 CI 就是这样：
      # 第一轮 windows-future 依赖没门控，第二轮才露出 cfg(not(windows)) 里
      # 的未用变量）。加它让一轮尽量把独立 crate 的问题一起报出来。
      # 注意它仍**不能**穿透失败 crate 的下游（拿不到元数据就没法查），
      # 所以这不是「一次全知」，只是把每轮的覆盖面撑大。
      - run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  # ── 门禁 2：主平台 + 可移植性 ──────────────────────────────────────
  # 钉的结论：全部单元/集成测试在 windows（真实目标平台，含 CreateProcessW
  # 与句柄泄漏那批 cfg(windows) 测试）和 ubuntu（防只按 Windows 写码漂移）都过。
  host:
    name: build+test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # egui/eframe 在 Linux 要 GL + X11 + Wayland 开发包；没有音频依赖
      # （Cargo.lock 里没有 cpal/alsa-sys），所以不装 libasound2。
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev wayland-protocols pkg-config
      - name: Test
        run: cargo test --workspace --locked
      # release 构建单独跑一次：`panic = "abort"`、lto 那套 profile 只在
      # release 生效，光跑 debug 判不出 release 才有的链接问题。
      - name: Release build
        run: cargo build --workspace --locked --release

  # ── 门禁 3a：插件「源码 → 真能跑」──────────────────────────────────
  # 钉的结论：从源码重编出的 wasm 能被**真宿主**加载并渲染出正确大纲。
  # 这条与工具链版本**无关**，所以永远不该因为 rustc 补丁号而判红——
  # 它测的是行为。
  plugin-behavior:
    name: plugin builds and works via real host
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rebuild plugin from source
        run: cargo build --release --manifest-path plugins/md-outline/Cargo.toml --target wasm32-unknown-unknown --locked
      - name: Load the rebuilt wasm through the real host
        # 用重编件**覆盖**入库件后再跑 e2e：这样测的是「源码产出的插件经宿主
        # ABI 能真的渲染」，而不是「仓库里那串字节碰巧能加载」。
        # 顺序很重要：先验行为，再谈哈希——行为不过就是真缺陷，哈希不过可能只是版本差。
        run: |
          BUILT=plugins/md-outline/target/wasm32-unknown-unknown/release/md_outline.wasm
          if [ ! -f "$BUILT" ]; then
            echo "::error::重编产物没找到，路径或 crate 名变了：$BUILT"
            exit 2
          fi
          echo "committed: $(sha256sum plugins/md-outline/md-outline.wasm)"
          echo "rebuilt:   $(sha256sum "$BUILT")"
          cmp -s plugins/md-outline/md-outline.wasm "$BUILT" \
            || echo "::notice::重编件与入库件字节不同（跨 rustc 版本属预期），下面照常验行为。"
          cp "$BUILT" plugins/md-outline/md-outline.wasm
          cargo test -p fmnr-plugins --locked

  # ── 门禁 3b：字节可复现（**钉死工具链**才成立）─────────────────────
  # 2026-10-16 的实测教训：这条原本与 3a 合成一个 job、跑在 ubuntu 的 stable 上，
  # 结果判红——CI 用的是 rustc **1.99.1 (58cf8f9c3 2026-10-13)**，
  # 而录这份产物时本机是 **1.99.0 (b940084d7 2026-09-28)**。
  # wasm 里有 `production` 自定义段记录编译器版本，所以字节必然不同。
  # ⇒ 「逐字节可复现」是个**有作用域的主张**：只有把编译器版本钉死、
  #   并且在**录制它的那类环境**里重编，它才成立。放在浮动 stable 上，
  #   它每天都可能因为上游发版而红，那种红不含信息，只会训练人去忽略红灯。
  # 所以这里显式钉 1.99.0 + windows（产物当初就在 windows-gnu 上录的）。
  # 升版流程：更新 local/CI 工具链 → 重录产物 → 把本 job 的 pin 一起改掉。
  plugin-repro:
    name: plugin byte-reproducible (pinned toolchain)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - name: Rebuild with the pinned toolchain and compare bytes
        shell: bash
        run: |
          cargo build --release --manifest-path plugins/md-outline/Cargo.toml --target wasm32-unknown-unknown --locked
          BUILT=plugins/md-outline/target/wasm32-unknown-unknown/release/md_outline.wasm
          if [ ! -f "$BUILT" ]; then
            echo "::error::重编产物没找到，路径或 crate 名变了：$BUILT"
            exit 2
          fi
          echo "committed: $(sha256sum plugins/md-outline/md-outline.wasm)"
          echo "rebuilt:   $(sha256sum "$BUILT")"
          if ! cmp -s plugins/md-outline/md-outline.wasm "$BUILT"; then
            echo "::error::在**录制该产物的同一工具链(1.99.0/windows)**下重编，字节仍不一致。"
            echo "::error::这才是真信号：源码与分发件分叉了，或 pin 与实际录制环境不符。"
            echo "::error::若是有意升级工具链，请重录产物并把本 job 的 toolchain 一起改。"
            exit 1
          fi
          echo "同工具链下逐字节可复现。"

  # ── 门禁 4a：仓库卫生（拼写 + 未使用依赖）──────────────────────────
  # 钉的结论：仓里的英文拼写错误 = 0；每个 crate 声明的依赖都真的被用到。
  # 这两条都是**会悄悄烂掉**的东西：拼写错在注释里没人管，未使用的依赖
  # 只增不减（本仓上线时就有 9 个，删掉后编译图少了一圈）。
  # 工具版本**钉死**：typos 的词典会随版本变，浮动版本会让门某天自己变红。
  hygiene:
    name: 仓库卫生（拼写 + 未使用依赖）
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 拼写（typos）
        run: |
          cargo install typos-cli --version 1.51.1 --locked
          typos
      - name: 未使用的依赖（cargo-machete）
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete

  # ── 门禁 4b：供应链（漏洞 / 许可证 / 来源）────────────────────────
  # 钉的结论：RUSTSEC 没有**可利用的**漏洞、所有依赖的许可证都在 deny.toml
  # 的白名单里、依赖只来自 crates.io。
  # 配置在 `deny.toml`：unmaintained 只查直接依赖；重复版本降成 warning
  # （锁里本来就有多份 base64/windows-sys，判红只会训练人忽略红灯）。
  # 唯一一条 ignore 是 RUSTSEC-2023-0071（rsa，russh 传进来的），
  # 理由与"上游发版就删"的约定写在 deny.toml 里。
  supply:
    name: 供应链（漏洞 + 许可证 + 来源）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check advisories licenses sources

  # ── 门禁 4：外部客户端契约（MCP / HTTP / CLI）──────────────────────
  # 钉的结论：三个前端共用同一个内核分发表，不会出现「CLI 能删、MCP 不能」。
  # 这些测试已经在 `host` 的 --workspace 里跑过，这里单列是因为它们是
  # **起真子进程**的契约测试，判红时最可能是接口漂移，值得一个独立信号。
  contracts:
    name: external client contracts
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p fmnr-ai --locked --test mcp_contract --test http_contract
      - run: cargo test -p fmnr-cli --locked --test cli_e2e
